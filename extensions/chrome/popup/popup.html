<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Measured Humanizer Settings</title>
  <style>
    :root {
      --bg: #090d16;
      --surface: #101726;
      --border: #1e293b;
      --primary: #3b82f6;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      padding: 16px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .logo { font-weight: 800; font-size: 14px; display: flex; align-items: center; gap: 6px; }
    .logo span { color: var(--primary); }
    .status-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 9999px;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 11px; font-weight: 700; color: var(--text-muted); margin-bottom: 4px; }
    select, input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
    }
    select:focus, input:focus { border-color: var(--primary); }
    .btn-save {
      width: 100%;
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: white;
      border: none;
      padding: 9px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      margin-top: 6px;
      transition: filter 0.15s;
    }
    .btn-save:hover { filter: brightness(1.1); }
    .footer-links {
      margin-top: 14px;
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      border-top: 1px solid var(--border);
      padding-top: 10px;
    }
    .footer-links a { color: #60a5fa; text-decoration: none; }
    .footer-links a:hover { text-decoration: underline; }
    .toast {
      color: #34d399;
      font-size: 11px;
      text-align: center;
      margin-top: 6px;
      display: none;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">⚡ Measured<span>Humanizer</span></div>
    <div class="status-badge">Active</div>
  </header>

  <div class="form-group">
    <label for="profile">Default Domain Profile</label>
    <select id="profile">
      <option value="engineering">🛠️ Engineering (Technical Docs & Code)</option>
      <option value="executive">💼 Executive (Briefs & Strategy)</option>
      <option value="marketing">📣 Marketing (Punchy Web Copy)</option>
      <option value="academic">🎓 Academic (Research & Formal)</option>
    </select>
  </div>

  <div class="form-group">
    <label for="provider">Repair Engine Provider</label>
    <select id="provider">
      <option value="ollama">Local Ollama (100% Free / Private)</option>
      <option value="openai">OpenAI (GPT-4o / Compatible)</option>
      <option value="anthropic">Anthropic (Claude 3.5)</option>
      <option value="mock">Offline Heuristic Patcher</option>
    </select>
  </div>

  <div class="form-group" id="endpoint-group">
    <label for="endpoint">Endpoint URL</label>
    <input type="text" id="endpoint" placeholder="http://127.0.0.1:11434/v1/chat/completions">
  </div>

  <div class="form-group" id="model-group">
    <label for="model">Model Name</label>
    <input type="text" id="model" placeholder="measured-slm">
  </div>

  <div class="form-group" id="key-group">
    <label for="apiKey">API Key (Optional for Ollama)</label>
    <input type="password" id="apiKey" placeholder="sk-...">
  </div>

  <button class="btn-save" id="btn-save">Save Settings</button>
  <div class="toast" id="toast">✓ Settings saved successfully!</div>

  <div class="footer-links">
    <a href="https://sadhvikchirunomula.github.io/measured-humanizer/" target="_blank">Web Playground</a>
    <a href="https://github.com/SadhvikChirunomula/measured-humanizer" target="_blank">GitHub ⭐</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
