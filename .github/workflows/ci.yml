name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [16.x, 18.x, 20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run test suite
        run: npm test

      - name: Test npx / bin CLI execution & Step Summary
        run: |
          node bin/measured-humanizer.js tests/fixtures/human_shaped.md --brief
          node bin/measured-humanizer.js tests/fixtures/human_shaped.md --summary
          node bin/measured-humanizer.js tests/fixtures/ai_shaped.md --brief || true

      - name: Test MCP Server protocol
        run: |
          printf '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}\n{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}\n' | node bin/mcp-server.js
