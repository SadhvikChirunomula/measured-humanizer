name: GitHub Repository Traffic Stats

on:
  schedule:
    # Runs automatically every day at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check token
        id: check-token
        run: |
          if [ -z "${{ secrets.STATS_TOKEN }}" ]; then
            echo "STATS_TOKEN secret is not configured. Skipping traffic stats fetch."
            echo "has_token=false" >> $GITHUB_OUTPUT
          else
            echo "has_token=true" >> $GITHUB_OUTPUT
          fi

      - name: Fetch and aggregate repository stats
        if: steps.check-token.outputs.has_token == 'true'
        uses: jgehrcke/github-repo-stats@v1.4.2
        with:
          # A Personal Access Token (PAT) with 'repo' scope is required 
          # because the default GITHUB_TOKEN cannot access traffic API data.
          repository: ${{ github.repository }}
          ghtoken: ${{ secrets.STATS_TOKEN }}
